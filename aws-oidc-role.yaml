AWSTemplateFormatVersion: '2010-09-09'
Description: 'Configures OIDC provider and IAM Role for GitHub Actions least-privilege EKS/ECR access.'

Parameters:
  GitHubOrg:
    Type: String
    Description: 'The GitHub Organization or Username'
  GitHubRepo:
    Type: String
    Description: 'The GitHub Repository name'

Resources:
  # OIDC Provider for GitHub (Created once per AWS account)
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://githubusercontent.com
      ClientIdList:
        - ://amazonaws.com
      ThumbprintList:
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Execution Role for GitHub Actions Pipeline
  GitHubActionsWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-eks-deployment-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                ://githubusercontent.com:aud: ://amazonaws.com
              StringLike:
                ://githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'

      Policies:
        - PolicyName: ECR-LeastPrivilege-Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${GitHubRepo}'
                
        - PolicyName: EKS-Describe-Cluster-Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                Resource: !Sub 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/*'
